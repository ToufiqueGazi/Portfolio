name: Deploy Academic Portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Determine GitHub Pages Base Path
        id: pages-path
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO_NAME" =~ \.github\.io$ ]]; then
            echo "base_path=" >> $GITHUB_OUTPUT
            echo "site_url=https://${OWNER}.github.io" >> $GITHUB_OUTPUT
          else
            echo "base_path=/${REPO_NAME}" >> $GITHUB_OUTPUT
            echo "site_url=https://${OWNER}.github.io/${REPO_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Validate Markdown Content
        run: npm run validate

      - name: Build static site with GitHub Pages basePath
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages-path.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages-path.outputs.site_url }}
        run: npm run build

      - name: Verify static export output
        run: |
          if [ ! -d "./out" ] || [ ! -f "./out/index.html" ]; then
            echo "Fatal: static output directory './out' is missing or incomplete."
            exit 1
          fi
          touch ./out/.nojekyll
          echo "Verified out/ directory with index.html and .nojekyll."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
